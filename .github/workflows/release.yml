name: Build release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Make application
        shell: bash
        run: |
          set +e
          set -o pipefail
          make -C code 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "===== BUILD ERROR SUMMARY ====="
          grep -nE "(^|[[:space:]])(error:|fatal error:)|undefined reference|relocation truncated|region .* overflowed|will not fit in region|collect2:" build.log | tail -n 120 || true
          echo "===== END BUILD ERROR SUMMARY ====="
          exit "$status"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: build.log
          name: build-log
      - name: Prepare for build publishing
        run: |
          mkdir -p out/_gba/
          cp -f code/bootstrap/GBARunner3.nds out/
          cp -r configs out/_gba/
          cp -r cheats out/_gba/
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: out
          name: GBARunner3
      - name: Package for release
        run: |
          cd out && zip -r ../GBARunner3.zip *
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            GBARunner3.zip
